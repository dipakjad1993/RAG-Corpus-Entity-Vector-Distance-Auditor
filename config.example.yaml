target_brand: "Acme Software"
industry_topics:           # any number of topics — no limit
  - "enterprise churn prediction"
  - "SaaS pipeline analytics"
  - "CRM automation"
competitor_entities:       # any number of competitors — no limit
  - "Salesforce"
  - "HubSpot"
  - "Zendesk"
crawl_depth: 50
max_search_queries: 120    # bounds live search calls (topics/comps themselves are unlimited)
locality: null
harvester: "duckduckgo"          # duckduckgo | searxng | file
searxng_base_url: null
corpus_dir: null
include_reddit: true
include_news: true
embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
spacy_model: "en_core_web_sm"
output_dir: "./ragevda_output"

# ---- Enterprise / AI-engine inputs (all optional, sensible defaults) ----
# Search-intent has templates that shape query generation.
search_intent: "informational"   # informational | commercial | navigational | transactional | comparison | local
query_templates: null            # override the intent template set (list of {pattern, intent})
# Ontology aliases / sub-brands extend NER + query expansion (dict of brand -> [aliases]).
ontology_aliases:
  "Acme Software": ["Acme CRM", "Acme Pro"]
# Custom entity weighting (dict of entity -> relative weight, default 1.0).
entity_weighting:
  "Acme Software": 1.5
# Historical ground-truth corpora: internal brand / whitepaper files
# (PDF/MD/TXT) compared against the Web RAG vector. Also a folder via corpus_dir.
corpus_files: []                 # e.g. ["./docs/acme-whitepaper.pdf"]
# Content feeds (RSS / sitemap URLs) pulled in as real-time corpus documents.
content_feeds: []                # e.g. ["https://example.com/feed.xml"]
# Search-engine scraping footprints: concrete source URLs per AI-engine surface,
# format "engine|label|url" (engine/label optional).
serp_footprints: []              # e.g. ["Perplexity|guide|https://x.com/g"]
# RAG chunking / contextual-window simulation settings.
chunk_tokens: 512
chunk_overlap_tokens: 64
# Token-density adjuster target + retrieval depth.
target_entity_density: 0.015
top_k_retrieval: 5
# AI-engine matrix modelled for the SoV heatmap.
engine_matrix:
  - "Google AI Overviews"
  - "SearchGPT"
  - "Gemini"
  - "Perplexity"
  - "Bing Copilot"
# Semantic drift history retention (runs).
drift_history_keep: 60
# Synthetic query generator.
synthetic_query_count: 12
# Optional local Ollama LLM for gap-analysis rationales (graceful if unreachable).
use_llm: true
ollama_base_url: null             # e.g. http://localhost:11434
ollama_model: "llama3"
