[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragevda"
version = "2.1.1"
description = "RAG Corpus Entity & Vector Distance Auditor - enterprise AI-search (GEO) visibility intelligence."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "RAG-EVDA" }]
keywords = ["rag", "seo", "geo", "embeddings", "vector", "ner", "semantic", "audit"]

dependencies = [
    "sentence-transformers>=2.3.0",
    "torch>=2.1.0",
    "spacy>=3.7.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "networkx>=3.1.0",
    "duckdb>=0.10.0",
    "trafilatura>=1.6.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "httpx>=0.27.0",
    "regex>=2023.0.0",
    "pyyaml>=6.0.0",
    "pandas>=2.0.0",
    "ddgs>=4.0.0",
    "flask>=3.0.0",
    "transformers>=4.38.0",
    "huggingface_hub>=0.20.0",
    "tokenizers>=0.15.0",
    "reportlab>=4.0.0",
    "pypdf>=4.0.0",
    "pydantic>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "pip-audit>=2.7"]
enterprise = ["faiss-cpu>=1.8.0", "opentelemetry-instrumentation-fastapi>=0.44.0"]
full = ["faiss-cpu>=1.8.0", "opentelemetry-instrumentation-fastapi>=0.44.0"]
# LITE (Render free 512MB): pip install -e . + requirements.render.txt.
# Heavy deps (torch CUDA, transformers, pandas, reportlab, faiss, fastapi)
# are NEVER imported at web boot (/health) — see Dockerfile.render,
# RAGEVDA_LITE=1, and lazy loaders in reporting/pdf_report.py + webapp.py.
lite = []

[project.scripts]
ragevda = "ragevda.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [ "geo: enterprise GEO quality gates (RAGAS-style eval + harvester + drift + API)" ]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.hatch.build.targets.wheel]
packages = ["ragevda"]
