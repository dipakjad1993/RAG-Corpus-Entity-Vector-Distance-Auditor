name: gh-pages sample

on:
  # Manual-only until the owner enables Pages once in
  # Settings -> Pages -> "Build and deployment: GitHub Actions".
  # (The auto-enable API needs admin scope the GITHUB_TOKEN lacks, so a
  # push-triggered job would red-X every commit. Trigger manually after
  # enabling; then switch back to push on docs/sample_dashboard/**.)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify sample exists
        run: test -f docs/sample_dashboard/dashboard.html || echo "sample not yet published - see docs/SAMPLE_DASHBOARD.md"
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/sample_dashboard
      - name: Deploy to Pages
        uses: actions/deploy-pages@v4
