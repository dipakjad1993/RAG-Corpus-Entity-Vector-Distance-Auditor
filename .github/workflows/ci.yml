name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fast-tests:
    name: Fast unit tests (no network, no models)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install light deps (test-only path)
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff pyyaml networkx reportlab numpy

      - name: Ruff check
        run: ruff check ragevda tests || true

      - name: Fast tests
        run: python -m pytest tests/ -q

  heavy-imports:
    name: Full dependency import check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install full requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: spaCy model
        run: python -m spacy download en_core_web_sm

      - name: CLI boots
        run: python -m ragevda.cli --version
