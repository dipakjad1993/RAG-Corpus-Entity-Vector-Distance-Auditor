# =====================================================================
# RAG-EVDA — INPUTS
# Fill in the fields below with YOUR REAL brand details, then run:
#     python -m ragevda.cli run -c config.yaml
# WARNING: Do NOT use placeholder names (Acme, Widget, CompA, etc.)
# The tool validates that real, non-trivial names are supplied.
#
# For a guided, interactive generator use: python -m ragevda.cli init
# =====================================================================

# 1) TARGET BRAND NAME  (your real brand / site name)
target_brand: "YourBrand"

# 2) TARGET INDUSTRY TOPICS / CONCEPTS  (real topics you compete for)
industry_topics:
  - "your primary industry topic"
  - "your secondary topic"
  - "your tertiary topic"

# 3) COMPETITOR ENTITIES  (real direct competitor names)
competitor_entities:
  - "CompetitorA"
  - "CompetitorB"

# 4) CRAWL DEPTH PARAMETER  (results/pages scraped per query, 1-200)
crawl_depth: 50

# 5) TARGET LOCALITY / GEOGRAPHIC TARGET  (e.g. "US", "UK"; null = global)
locality: null

# ---------------------------------------------------------------------
# Engine settings (normally you can leave these alone)
# ---------------------------------------------------------------------
harvester: "duckduckgo"          # duckduckgo | searxng | file
searxng_base_url: null
corpus_dir: null
include_reddit: true
include_news: true
embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
spacy_model: "en_core_web_sm"
output_dir: "./web_output"
require_real_models: true        # never emit fake/degraded numbers
