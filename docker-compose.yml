services:
  web:
    build: .
    ports:
      - "9000:9000"
    volumes:
      - ./web_output:/app/web_output
    environment:
      # Runtime is offline ONLY because the image pre-caches models at build
      # time (see Dockerfile). For a first build without cache, run once with
      # HF_HUB_OFFLINE=0 + HF_TOKEN set, then switch back to 1.
      HF_HUB_OFFLINE: "1"
      HF_TOKEN: "${HF_TOKEN:-}"
    restart: unless-stopped

  # Full stack: self-hosted search (higher-volume live harvesting).
  # Run: docker compose --profile full up
  searxng:
    image: searxng/searxng:latest
    profiles: [full]
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/searxng:/etc/searxng:ro
    restart: unless-stopped

  # Full stack: local LLM rationales (gap analysis, never invents data).
  # Run: docker compose --profile full up
  ollama:
    image: ollama/ollama:latest
    profiles: [full]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_data:
